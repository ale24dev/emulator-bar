[package]
name = "emulator-bar"
version = "0.1.0"
description = "Menu-bar controller for Android emulators and iOS simulators"
authors = ["Ale Diaz"]
edition = "2024"
license = "MIT"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
name = "emulator_bar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "macros", "rt-multi-thread", "fs"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-autostart = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
